<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TeXKoi</title>
  <link rel="stylesheet" href="editor.css">
  <link id="wps-theme" rel="stylesheet" href="/wps-theme.css">
  <script src="main.js"></script>
  <script src="history.js"></script>
</head>
<body>
  <main class="editor">
    <header><span class="brand">TeXKoi</span><h1>New equation</h1></header>
    <section class="source-section" aria-labelledby="source-label">
      <label id="source-label" for="source">LaTeX source</label>
      <textarea id="source" spellcheck="false" autocapitalize="off" autocomplete="off" aria-describedby="source-hint">E = mc^{2}</textarea>
      <p id="source-hint" class="hint">Math only, without <code>$</code> delimiters. <code>amsmath</code> and <code>amssymb</code> included.</p>
    </section>
    <div class="settings">
      <div class="field"><label for="size">Size <span class="unit">pt</span></label><input id="size" type="number" min="6" max="144" value="28" step="1"></div>
      <div class="field"><label for="format">Format</label><select id="format"><option value="svg">SVG · vector</option><option value="png">PNG · 300 DPI</option></select></div>
    </div>
    <section class="preview-section" aria-labelledby="preview-label">
      <span id="preview-label" class="field-label">Preview</span>
      <div id="preview" class="preview empty"><span>Render to preview your equation</span></div>
    </section>
    <div class="feedback">
      <p id="status" role="status" aria-live="polite"></p>
      <details id="error-details" hidden><summary>Compiler details</summary><pre id="error-log"></pre></details>
    </div>
    <footer>
      <span class="hint shortcut">Ctrl+Enter to insert</span>
      <div class="actions"><button id="render" type="button" title="Ctrl+Shift+Enter">Render preview</button><button id="insert" class="primary" type="button" title="Ctrl+Enter">Render &amp; insert</button></div>
    </footer>
  </main>
  <script src="editor.js"></script>
  <script src="theme.js"></script>
</body>
</html>
