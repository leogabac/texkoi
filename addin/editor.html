<!doctype html>
<html><head><meta charset="utf-8"><title>TeXKoi</title>
<style>
body {font: 15px system-ui,sans-serif; margin:24px; color:#203c34; background:#f7faf8}
h1 {font-size:22px} textarea {box-sizing:border-box;width:100%;height:160px;padding:12px;font:16px monospace;border:1px solid #9aafa6;border-radius:6px}
button {padding:10px 18px; margin:12px 8px 0 0;cursor:pointer} #preview {min-height:90px;padding:16px;background:white;margin-top:16px;overflow:auto} img {max-width:100%;height:auto} pre {white-space:pre-wrap;color:#9b2d29;max-height:130px;overflow:auto} label {display:block;margin-bottom:8px}
</style><script src="main.js"></script></head><body>
<h1>New equation</h1><label for="source">LaTeX math source</label>
<textarea id="source" spellcheck="false">E = mc^{2}</textarea>
<div>Use a math fragment without $ delimiters. amsmath and amssymb are included.</div>
<div style="margin-top:12px"><label>Output <select id="format"><option value="svg">SVG (vector)</option><option value="png">PNG (300 DPI)</option></select></label><label>Size (pt) <input id="size" type="number" min="6" max="144" value="28" step="1"></label></div>
<button id="render">Render preview</button><button id="insert">Render &amp; insert</button>
<div id="preview">Your rendered equation will appear here.</div><pre id="status" role="status"></pre>
<script src="editor.js"></script></body></html>
