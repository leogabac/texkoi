<!doctype html>
<html><head><meta charset="utf-8"><title>TeXKoi protocol probe</title>
<style>body{font:16px sans-serif;margin:28px;line-height:1.5}a{display:inline-block;padding:10px 16px;background:#1769aa;color:white;border-radius:5px;text-decoration:none}</style>
<script src="protocol-probe-config.js"></script><script src="main.js"></script></head>
<body><p>Click this link directly to test whether WPS allows an external application launch from its editor browser.</p>
<a id="launch" target="_blank" rel="noopener">Launch TeXKoi test handler</a>
<p id="result">Allow an external-application prompt if one appears. The result appears within 20 seconds.</p>
<script>
var linkTokenBytes = new Uint8Array(16);
window.crypto.getRandomValues(linkTokenBytes);
var linkToken = Array.prototype.map.call(linkTokenBytes, function(n) { return ('0' + n.toString(16)).slice(-2); }).join('');
var launchLink = document.getElementById('launch');
launchLink.href = 'texkoi://probe?token=' + linkToken;
launchLink.addEventListener('click', function(event) {
  if (protocolProbeBusy) { event.preventDefault(); return; }
  testProtocolProbe('link', linkToken);
});
</script></body></html>
